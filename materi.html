<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFocus - Materi Pembelajaran</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <h1 class="text-xl font-bold text-brand-600 dark:text-brand-500">EduFocus</h1>
      </div>

      <nav class="flex items-center gap-2">
        <a href="index.html" class="px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">Dashboard</a>
        <a href="materi.html" class="px-3 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white">Materi</a>
        <a href="ai.html" class="px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">AI Assistant</a>
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2 text-lg rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700">🌙</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="p-6 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold">📚 Daftar Materi Dokumen</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400">Klik tombol "Baca PDF" untuk membuka pratinjau dokumen langsung.</p>
        </div>
      </div>

      <!-- Tabel Daftar Materi -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold border-b border-slate-200 dark:border-slate-600">
            <tr>
              <th class="p-3">Nama File</th>
              <th class="p-3">Ukuran</th>
              <th class="p-3">Aksi</th>
            </tr>
          </thead>
          <tbody id="materi-list-body" class="divide-y divide-slate-100 dark:divide-slate-700">
            <tr>
              <td colspan="3" class="p-4 text-center text-slate-400">Memuat materi...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL PDF READER VIEWER -->
  <div id="pdfModal" class="pdf-modal-overlay" style="display: none;">
    <div class="pdf-modal-container">
      <div class="pdf-modal-header">
        <div class="pdf-title-container">
          <span class="text-lg">📄</span>
          <h3 id="pdfTitle" class="pdf-title">Dokumen PDF</h3>
        </div>
        <div class="flex items-center gap-2">
          <!-- External Fallback Link -->
          <a id="pdfExternalLink" href="#" target="_blank" class="px-3 py-1 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-xs font-medium rounded transition-colors text-slate-700 dark:text-slate-200">
            🔗 Buka di Tab Baru
          </a>
          <button type="button" class="pdf-close-btn" onclick="closePdfViewer()">&times;</button>
        </div>
      </div>
      <div class="pdf-modal-body">
        <iframe id="pdfFrame" src="" title="PDF Reader" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
