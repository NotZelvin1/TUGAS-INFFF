<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belajar · Ruang Belajar</title>
<script src="js/tema-awal.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/belajar.css">
</head>
<body data-page="belajar" data-mode="fokus" data-view="reader">
<!-- Header, navigasi bawah, dialog "Cara pakai", dan toast dipasang oleh js/common.js -->

<main>
  <section id="lib" aria-label="Daftar materi">
    <label class="upload" id="dropzone">
      Tambah materi
      <small>PDF, TXT, atau MD (maks. 25 MB). Judul mengikuti nama file.</small>
      <input type="file" id="berkas">
    </label>
    <h2>Materi saya</h2>
    <ul id="daftar"></ul>
  </section>

  <section id="reader" aria-label="Pembaca materi">
    <div class="kosong"><strong>Belum ada materi yang dibuka</strong>Pilih materi di daftar, atau unggah PDF/TXT. Timer Pomodoro tetap berjalan selama kamu membaca.</div>
  </section>

  <section id="chat" aria-label="Tanya AI">
    <h2>Tanya AI tentang materi ini</h2>
    <div id="pesan"></div>
    <div class="chips" id="chips">
      <button data-q="Ringkas materi ini dalam poin-poin utama.">Ringkas materi</button>
      <button data-q="Buat 5 soal latihan beserta jawabannya dari materi ini.">Buat soal latihan</button>
      <button data-q="Jelaskan konsep paling penting di materi ini dengan bahasa sederhana.">Jelaskan konsep utama</button>
    </div>
    <form id="formTanya" autocomplete="off">
      <input id="inputTanya" placeholder="Tulis pertanyaan…" maxlength="1000">
      <button class="btn primary" id="kirim">Kirim</button>
    </form>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="Bagian belajar">
  <button role="tab" data-view="lib">Materi</button>
  <button role="tab" data-view="reader">Baca</button>
  <button role="tab" data-view="chat">Tanya AI</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/belajar.js"></script>
</body>
</html>
