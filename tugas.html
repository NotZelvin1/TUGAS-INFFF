<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFocus - Daftar Tugas</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <h2>EduFocus</h2>
      </div>

      <div class="search-box">
        <input type="text" id="global-search" placeholder="Cari tugas..." />
        <button class="btn-search">Cari</button>
      </div>

      <div class="nav-controls">
        <a href="index.html" class="nav-btn">Dashboard</a>
        <a href="materi.html" class="nav-btn">Materi</a>
        <a href="tugas.html" class="nav-btn active">Tugas</a>
        <a href="pomodoro.html" class="nav-btn">Pomodoro</a>
        <a href="ai.html" class="nav-btn">AI Assistant</a>
        <button id="theme-toggle" class="btn-icon" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </header>

  <main class="main-layout">
    <aside class="sidebar">
      <div class="card">
        <h3>Menu Tugas</h3>
        <ul class="quick-links">
          <li><a href="#">📌 Semua Tugas</a></li>
          <li><a href="#">✅ Tugas Selesai</a></li>
        </ul>
      </div>
    </aside>

    <section class="content-area">
      <div class="card">
        <h3>Daftar Tugas Belajar</h3>
        <div class="add-task-form">
          <input type="text" id="task-input" placeholder="Tambah tugas baru..." />
          <button class="btn btn-primary" onclick="addTask()">Tambah</button>
        </div>
        <div id="task-list" class="task-list-container">
          <!-- Rendered oleh JS secara otomatis -->
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', targetTheme);
      document.getElementById('theme-toggle').innerText = targetTheme === 'dark' ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
