<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFocus - Pomodoro Focus</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="logo-icon">⚡</span>
        <h2>EduFocus</h2>
      </div>

      <div class="search-box">
        <input type="text" id="global-search" placeholder="Cari..." />
        <button class="btn-search">Cari</button>
      </div>

      <div class="nav-controls">
        <a href="index.html" class="nav-btn">Dashboard</a>
        <a href="materi.html" class="nav-btn">Materi</a>
        <a href="tugas.html" class="nav-btn">Tugas</a>
        <a href="pomodoro.html" class="nav-btn active">Pomodoro</a>
        <a href="ai.html" class="nav-btn">AI Assistant</a>
        <button id="theme-toggle" class="btn-icon" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </header>

  <main class="main-layout">
    <aside class="sidebar">
      <div class="card">
        <h3>Pengaturan Waktu</h3>
        <p class="text-muted">Metode Pomodoro: 25 Menit Fokus & 5 Menit Istirahat.</p>
      </div>
    </aside>

    <section class="content-area">
      <div class="card text-center" style="padding: 40px 20px;">
        <h2>Sesi Fokus Belajar</h2>
        <p id="pomo-status" class="badge" style="margin-top: 12px;">Focus Session</p>
        <div id="timer-display" class="timer-clock" style="font-size: 5rem;">25:00</div>
        <div class="button-group">
          <button id="pomo-btn" class="btn btn-primary" onclick="togglePomodoro()">Start</button>
          <button class="btn btn-secondary" onclick="resetPomodoro()">Reset</button>
        </div>
      </div>

      <div class="card">
        <h3>Riwayat Belajar</h3>
        <ul id="calendar-log" class="history-list"></ul>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', targetTheme);
      document.getElementById('theme-toggle').innerText = targetTheme === 'dark' ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
