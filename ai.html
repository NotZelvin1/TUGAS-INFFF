<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFocus - AI Assistant</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <h1 class="text-xl font-bold text-brand-600 dark:text-brand-500">EduFocus</h1>
      </div>

      <nav class="flex items-center gap-2">
        <a href="index.html" class="px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">Dashboard</a>
        <a href="materi.html" class="px-3 py-2 text-sm font-medium rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">Materi</a>
        <a href="ai.html" class="px-3 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white">AI Assistant</a>
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2 text-lg rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700">🌙</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col h-[80vh]">
      
      <!-- AI Header -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">🤖</span>
          <h2 class="font-bold text-base">EduFocus AI Assistant</h2>
        </div>
        <span class="text-xs px-2.5 py-1 bg-brand-100 dark:bg-brand-900 text-brand-600 dark:text-brand-300 rounded-full font-medium">Terhubung dengan Materi</span>
      </div>

      <!-- Chat Messages Container -->
      <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm">
        <div class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-xs flex-shrink-0">AI</div>
          <div class="p-3 bg-slate-100 dark:bg-slate-700 rounded-xl max-w-[80%]">
            Halo! Saya AI Assistant Anda. Tanyakan apa saja terkait materi dokumen yang telah diunggah!
          </div>
        </div>
      </div>

      <!-- Input Box -->
      <form onsubmit="handleAiChat(event)" class="p-4 border-t border-slate-200 dark:border-slate-700 flex gap-2">
        <input type="text" id="ai-input" placeholder="Tanyakan seputar materi..." class="flex-1 px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:border-brand-600" required>
        <button type="submit" id="ai-submit-btn" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition-colors">Kirim</button>
      </form>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
